name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (README says 3.10+) and a current one.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Versions come only from the requirements files. The extra index provides
      # CPU-only torch builds (2.14.1+cpu outranks PyPI's 2.14.1, which bundles
      # ~2.5 GB of CUDA that CI can't use); the assert catches a silent fallback.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; assert torch.version.cuda is None, 'CUDA build installed in CI'"

      - name: Lint
        run: ruff check .

      # The regression test needs the real Kaggle data, so it is skipped here (-rs prints why).
      - name: Test
        run: pytest -v -rs
