# The winning CNN configuration (cnn_best_from_search.yaml) with training-data augmentation
# added and nothing else changed: every training image is randomly shifted
# by up to 4 px per axis and rotated by up to 15 degrees. Targets the
# distribution-shift weakness (a 4 px shift breaks the original models).
architecture: cnn

data:
  data_dir: data
  train_csv: train.csv
  val_fraction: 0.2
  test_fraction: 0.2
  batch_size: 64
  num_workers: 2
  split_seed: 42
  augment_max_shift_px: 4
  augment_max_rotation_deg: 15

model:
  conv_channels: [64, 128]
  kernel_size: 3
  activation: gelu
  dropout: 0.015026644895738628
  fc_hidden_dim: 256
  num_classes: 10

optim:
  optimizer: adam
  lr: 0.00011324018558618522
  weight_decay: 1.9867047025820187e-05
  label_smoothing: 0.1
  lr_scheduler: null

trainer:
  max_epochs: 30
  accelerator: auto
  devices: 1
  patience: 5
  experiment_name: cnn_augmented
  training_seed: 42
