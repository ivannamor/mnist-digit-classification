# Winning CNN configuration from the Optuna search run on Kaggle Notebooks
# (2026-08-01, 20 trials, T4 GPU): best val_accuracy 0.9922, test_accuracy
# 0.9921. See REPORT.md for the full run context.
architecture: cnn

data:
  data_dir: data
  train_csv: train.csv
  val_fraction: 0.2
  test_fraction: 0.2
  batch_size: 64
  num_workers: 2
  split_seed: 42

model:
  conv_channels: [64, 128]
  kernel_size: 3
  activation: gelu
  dropout: 0.015026644895738628
  fc_hidden_dim: 256
  num_classes: 10

optim:
  optimizer: adam
  lr: 0.00011324018558618522
  weight_decay: 1.9867047025820187e-05
  label_smoothing: 0.1
  lr_scheduler: null

trainer:
  max_epochs: 30
  accelerator: auto
  devices: 1
  patience: 5
  experiment_name: cnn_best_from_search
  training_seed: 42
