# Winning configuration from the Optuna search run on Kaggle Notebooks
# (2026-08-01, 20 trials, T4 GPU). The search's trial scored val_accuracy
# 0.9787 (taken at its last epoch), vs. the baseline's 0.9719. Retrained from
# scratch, its best epoch (the committed checkpoint) reached val_accuracy
# 0.9812 and test_accuracy 0.9830 -- the numbers the README reports. All
# accuracies are balanced (macro); see the README. Full run context: REPORT.md.
data:
  data_dir: data
  train_csv: train.csv
  val_fraction: 0.2
  test_fraction: 0.2
  batch_size: 128
  num_workers: 2
  split_seed: 42

model:
  hidden_dims: [512, 256]
  activation: gelu
  dropout: 0.258885920517189
  num_classes: 10

optim:
  optimizer: adamw
  lr: 0.0009157770842261716
  weight_decay: 0.00043489682497903484
  label_smoothing: 0.1
  lr_scheduler: null

trainer:
  max_epochs: 30
  accelerator: auto
  devices: 1
  patience: 5
  experiment_name: best_from_search
  training_seed: 42
